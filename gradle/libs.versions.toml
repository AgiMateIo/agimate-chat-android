[versions]
agp = "9.3.1"
# AGP 9.3.1 приносит с собой KGP 2.2.10, но экосистема (coil, markdown-renderer) уже собрана
# Kotlin 2.4 — компилятор 2.2 её метаданные не читает. Поэтому KGP поднят через buildscript-classpath
# в корневом build.gradle.kts, и эта версия должна совпадать с тем, что там прописано.
kotlin = "2.4.10"
# KSP с версии 2.3.0 живёт своим semver и умеет встроенный Kotlin из AGP 9:
# более старые линии добавляют сгенерированные исходники через kotlin.sourceSets, что AGP 9 запрещает.
ksp = "2.3.11"
hilt = "2.60.1"

coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
composeBom = "2026.08.00"
navigationCompose = "2.9.8"
hiltNavigationCompose = "1.4.0"
browser = "1.10.0"

coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.4.0"
retrofit = "2.12.0"
retrofitSerialization = "1.0.0"
centrifuge = "0.7.0"
coil = "3.5.0"
markdown = "0.43.0"
rustorePush = "7.4.1"
# Плагин читает google-services.json и кладёт его значения в ресурсы — без него Firebase SDK
# не знает, к какому проекту подключаться.
googleServices = "4.5.0"

junit = "4.13.2"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"
turbine = "1.2.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerialization" }

centrifuge = { group = "io.github.centrifugal", name = "centrifuge-java", version.ref = "centrifuge" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

markdown-renderer = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-android", version.ref = "markdown" }
markdown-renderer-m3 = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-m3", version.ref = "markdown" }

# Универсальные пуши: фасад плюс транспорт. Транспорты подключаются по одному — FCM
# (`universalfcm`) и HMS (`universalhms`) добавляются тем же набором, когда до них дойдёт дело.
rustore-universalpush = { group = "ru.rustore.sdk", name = "universalpush", version.ref = "rustorePush" }
rustore-universalrustore = { group = "ru.rustore.sdk", name = "universalrustore", version.ref = "rustorePush" }
rustore-universalfcm = { group = "ru.rustore.sdk", name = "universalfcm", version.ref = "rustorePush" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver3-junit4", version.ref = "okhttp" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-espresso = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
